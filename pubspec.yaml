name: smart_clipboard_link
description: A privacy-first Flutter clipboard plugin that prevents iOS 14/16+ paste prompts using hasStrings and changeCount, with safe reading and clearing support.
version: 0.0.2
homepage: https://github.com/yanmingLiu/smart_clipboard_link
repository: https://github.com/yanmingLiu/smart_clipboard_link
issue_tracker: https://github.com/yanmingLiu/smart_clipboard_link/issues
topics:
  - clipboard
  - ios
  - privacy
  - deeplink
  - pasteboard

environment:
  sdk: ^3.10.9
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.smart_clipboard_link
        pluginClass: SmartClipboardLinkPlugin
      ios:
        pluginClass: SmartClipboardLinkPlugin
